name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint-markdown:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install -g markdownlint-cli
      - run: markdownlint .

  lint-source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
      - run: go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.10
      - run: golangci-lint run

  check-go-mod:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
      - run: go mod tidy
      - run: git diff --exit-code -- go.mod go.sum

  build-source:
    needs: lint-markdown
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
      - run: go build ./...

  unit-test:
    needs: lint-markdown
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
      - run: go test -coverprofile cover.out -race ./...
      - uses: codecov/codecov-action@v5
        with:
          files: cover.out
